[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "markchain"
version = "0.1.0.dev1"
description = "Durable local Markdown document workflows"
requires-python = ">=3.12"
dependencies = [
  "elasticsearch>=9.1,<10",
  "filelock>=3.20,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=1.20,<2",
  "persist-queue==1.1.0",
  "pydantic>=2.12,<3",
  "watchdog>=6,<8",
]

[project.scripts]
markchain = "markchain.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14", "mypy>=1.18", "build>=1.3"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PLR0913", "FBT", "D", "S101", "S110", "BLE", "G"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["persistqueue", "persistqueue.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]
addopts = "--basetemp=tests/.runtime"

[tool.hatch.build.targets.wheel]
packages = ["src/markchain"]
